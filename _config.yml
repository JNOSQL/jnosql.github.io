title: Eclipse JNoSQL™
url: https://www.jnosql.org
lang: en
description: Eclipse JNoSQL™ is an open-source Java framework that simplifies NoSQL persistence through Jakarta EE standards, supporting Key-Value, Document, Wide-Column, Graph, Time Series, and Vector databases.

theme: null

# debug:
#   compress: true
#   dist: false
#   shortcodes: true

jnosql_databases_version: "1.1.20"

docs_repository: JNOSQL/jnosql.github.io
docs_branch: main

readme_index:
  with_frontmatter: true

plugins:
  - jekyll-redirect-from
  - jemoji
  - jekyll-avatar
  - jekyll-mentions

exclude:
  - Makefile
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - requirements.txt
  - node_modules
  - package.json
  - package-lock.json
  - webpack.config.js
  - jekyll-rtd-theme.gemspec
